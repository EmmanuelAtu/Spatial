<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextGen Audio | 3D Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Deep dark background with soft neon gradients */
        body {
            background-color: #0f172a; 
            background-image: 
                radial-gradient(circle at top right, rgba(59, 130, 246, 0.3), transparent 40%),
                radial-gradient(circle at bottom left, rgba(139, 92, 246, 0.3), transparent 40%);
            background-attachment: fixed;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
        }
        
        /* The Glassmorphism Magic */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <!-- Main Product Container -->
    <main class="glass-panel rounded-3xl w-full max-w-6xl flex flex-col md:flex-row overflow-hidden">
        
        <!-- Text & Call to Action Section -->
        <div class="p-10 md:p-16 flex flex-col justify-center w-full md:w-1/2">
            <span class="text-blue-400 font-semibold tracking-wider text-sm mb-2">NEW RELEASE</span>
            <h1 class="text-5xl font-bold mb-4 leading-tight">Spatial <br> <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500">Audio Pro</span></h1>
            <p class="text-gray-400 mb-8 leading-relaxed">
                Experience sound in a whole new dimension. Engineered with next-gen acoustic tech and wrapped in a sleek, lightweight design.
            </p>
            
            <div class="flex gap-4">
                <button class="bg-white text-slate-900 px-6 py-3 rounded-full font-semibold hover:bg-gray-200 transition">Pre-order Now</button>
                <button class="glass-panel px-6 py-3 rounded-full font-semibold hover:bg-white/10 transition">View Specs</button>
            </div>
        </div>

        <!-- 3D Element Placeholder Section -->
        <div class="w-full md:w-1/2 min-h-[400px] flex items-center justify-center relative">
            <div class="absolute inset-0 bg-gradient-to-br from-blue-500/10 to-purple-500/10 rounded-r-3xl"></div>
            
            <!-- We will embed the 3D model here later -->
            <p class="text-gray-500 italic relative z-10">[ 3D Interactive Model Goes Here ]</p>
        </div>

    </main>

</body>
</html>
